<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e6edf3" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0d1117" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <style>
      .name { font: 700 64px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; letter-spacing: -1.5px; }
      .role { font: 400 24px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #9da7b3; }
      .mono { font: 500 15px 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #7d8590; letter-spacing: 1px; }
      .acc  { fill: #3fb9a5; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="14" fill="#0d1117"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="14" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="none" stroke="#30363d"/>

  <g stroke="#3fb9a5" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M880 90 L990 60 L1100 110 L1040 200 L930 220 Z"/>
    <path d="M880 90 L1040 200 M990 60 L930 220 M990 60 L1040 200"/>
  </g>
  <g fill="#0d1117" stroke="#3fb9a5" stroke-width="2">
    <circle cx="880" cy="90" r="7"/>
    <circle cx="990" cy="60" r="7"/>
    <circle cx="1100" cy="110" r="7"/>
    <circle cx="1040" cy="200" r="7"/>
    <circle cx="930" cy="220" r="7"/>
  </g>
  <circle cx="990" cy="60" r="3" class="acc"/>
  <circle cx="1040" cy="200" r="3" class="acc"/>

  <rect x="72" y="84" width="4" height="116" rx="2" class="acc"/>
  <text x="100" y="140" class="name">Mustafa</text>
  <text x="102" y="184" class="role">Backend Developer <tspan fill="#484f58">/</tspan> Python <tspan fill="#484f58">&amp;</tspan> Go</text>
  <text x="102" y="244" class="mono">WEB PLATFORMS  ·  TELEGRAM BOTS  ·  MINI APPS  ·  AUTOMATION<tspan class="acc cursor"> _</tspan></text>
</svg>
